name: qa-run
run-name: qa ${{ inputs.correlation_id }}

# Isolated Testwright test-execution runner (Phase 2b). Dispatched by the
# ML-Unified Space's /qa/run proxy with the generated Playwright test as an
# input. Runs on an ephemeral GitHub-hosted runner — nothing touches our site
# or the Space. The user-supplied code is passed via an env var (never
# interpolated into the shell) and the job holds no secrets.
#
# SPEED: runs inside the official Playwright image (browsers + OS deps already
# baked in), so there is NO `npx playwright install --with-deps` download on
# every run — that ~150MB + apt step (previously ~60-90s per run) is gone. The
# image tag is pinned to the SAME version as @playwright/test below so the
# preinstalled browser build matches the test runner. Bump both together.

on:
  workflow_dispatch:
    inputs:
      code:
        description: Playwright test source (@playwright/test)
        required: true
      base_url:
        description: Target base URL (own-site only; enforced upstream by the proxy)
        required: false
        default: ""
      test_name:
        description: Optional test name
        required: false
        default: ""
      correlation_id:
        description: Correlation id the proxy uses to find this run
        required: true
      repeat_each:
        description: Times to run the test back-to-back (flakiness check; 1 = normal)
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Browsers + OS deps are preinstalled in this image; keep the tag matched to
    # the @playwright/test version installed in the "Install" step below.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    # Headroom for a flakiness run (up to 10 repeats). No install download now,
    # so this is almost entirely test time.
    timeout-minutes: 15
    steps:
      # Bring in the committed test fixtures ONLY (sparse) — small sample files
      # (sample.png/csv/pdf/wav/mp4, fake-camera.y4m) a generated test uploads via
      # setInputFiles, and the fake media streams below. Nothing else from the repo
      # is needed by a run. If git is unavailable the job still runs; file-upload /
      # camera tests simply have no fixtures (same as before Phase 2).
      - name: Fetch fixtures
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: fixtures
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Prepare project
        env:
          CODE: ${{ github.event.inputs.code }}
        run: |
          mkdir -p tests
          printf '%s' "$CODE" > tests/generated.spec.ts
          cat > playwright.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          import path from 'node:path';
          import fs from 'node:fs';
          // Fixtures live in ./fixtures (sparse-checked-out above). Resolve to an
          // absolute path so the Chromium fake-media file flags work regardless of cwd.
          // Camera/mic tools: feed a synthetic stream so getUserMedia succeeds in CI
          // (no real device) and the permission prompt is auto-accepted — a test then
          // just clicks the capture/start control, no permission boilerplate. The file
          // flags are added only if the fixtures are present (checkout may be skipped);
          // without them Chromium's own synthetic device is used, so camera tests still run.
          const FX = path.resolve('fixtures');
          const mediaArgs = [
            '--use-fake-ui-for-media-stream',
            '--use-fake-device-for-media-stream',
            '--autoplay-policy=no-user-gesture-required',
          ];
          if (fs.existsSync(path.join(FX, 'fake-camera.y4m')))
            mediaArgs.push('--use-file-for-fake-video-capture=' + path.join(FX, 'fake-camera.y4m'));
          if (fs.existsSync(path.join(FX, 'fake-audio.wav')))
            mediaArgs.push('--use-file-for-fake-audio-capture=' + path.join(FX, 'fake-audio.wav'));
          export default defineConfig({
            testDir: './tests',
            timeout: 30000,
            // 15s for web-first assertions (default 5s is too short for a lazily
            // code-split / ssr:false widget to mount after an SPA navigation).
            expect: { timeout: 15000 },
            fullyParallel: true,
            workers: 3,
            retries: 0,
            reporter: [['json', { outputFile: 'results.json' }], ['line'], ['./reporter.js']],
            outputDir: './test-results',
            use: {
              headless: true,
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
              trace: 'retain-on-failure',
              launchOptions: { args: mediaArgs },
            },
          });
          EOF
          # Custom reporter — the built-in JSON reporter omits steps, so capture a
          # compact timeline (actions, expects, test.steps) into steps.json.
          cat > reporter.js <<'EOF'
          class StepReporter {
            constructor() { this.steps = []; }
            onStepEnd(test, result, step) {
              if (['pw:api', 'expect', 'test.step'].includes(step.category)) {
                this.steps.push({
                  title: step.title,
                  category: step.category,
                  duration: step.duration,
                  ok: !step.error,
                });
              }
            }
            onEnd() {
              require('fs').writeFileSync('steps.json', JSON.stringify(this.steps.slice(0, 100)));
            }
          }
          module.exports = StepReporter;
          EOF

      # Only the test runner package is needed — the browsers it drives are
      # already in the image (matching version), so NO `playwright install`.
      - name: Install @playwright/test
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D @playwright/test@1.55.0

      # A FAILING TEST IS A NORMAL, EXPECTED OUTCOME for a QA tool — it must NOT
      # fail the workflow run (that would email the repo owner on every failing
      # user test). continue-on-error keeps the job green; the real pass/fail is
      # read from results.json by the proxy. Only genuine infra errors (a broken
      # install step above) fail the run and are worth a notification.
      - name: Run test
        id: pw
        continue-on-error: true
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each }}
        run: |
          # Validate + clamp the repeat count (defence in depth; the proxy also
          # bounds it). Non-numeric or out-of-range falls back to a single run.
          R="$REPEAT_EACH"
          echo "$R" | grep -qE '^[0-9]+$' || R=1
          [ "$R" -lt 1 ] && R=1
          [ "$R" -gt 10 ] && R=10
          npx playwright test --repeat-each="$R"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            results.json
            steps.json
            aria.txt
            test-results/
          retention-days: 1
          if-no-files-found: warn
